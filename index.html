</style><aside><div class="brand">Scam <span>Safe</span></div><small>OPERATIONS CONSOLE</small><nav id="nav"></nav><footer>FinTech project · Interactive prototype<br>Sample data · No live agency connection</footer></aside><div class="shell"><header><span class="badge">Operations workspace</span><label style="margin:0;display:flex;align-items:center;gap:12px">Role <select id="role"><option>Administrator</option><option>Case officer</option><option>Community moderator</option><option>Analyst</option></select></label></header><main id="main"></main></div><dialog id="modal"></dialog><div id="toast" role="status"></div><script>
const pages=[['BO01','Overview'],['BO02','Reports & Evidence'],['BO03','Community'],['BO04','Disputes'],['BO05','Agency Referrals']];
let page=new URLSearchParams(location.search).get('page')||'BO01',tab='Details',report='RPT-001',post='Awaiting review',comment='Published',dispute='Reviewing',ref='Sent, awaiting acknowledgment',linked=true,postText="The page used photos that looked like a real hotel and asked for payment up front. After paying, I could not reach the page again, and the hotel had no record of my booking.";const logs=[];
const main=document.getElementById('main'),modal=document.getElementById('modal'),role=()=>document.getElementById('role').value,caseAccess=()=>['Administrator','Case officer'].includes(role()),moderate=()=>['Administrator','Community moderator'].includes(role());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const badge=(t,c='')=>`<span class="badge ${c}">${t}</span>`;const btn=(t,a,p=false,disabled=false)=>`<button data-action="${a}" class="${p?'primary':''}" ${disabled?'disabled':''}>${t}</button>`;const heading=(t,d)=>`<div class="row between"><div><span class="muted">SCAM SAFE / OPERATIONS</span><h1>${t}</h1><span class="muted">${d}</span></div>${badge('Sample data','gray')}</div>`;const note=t=>`<p class="page-note">${t}</p>`;
const reports=Array.from({length:24},(_,i)=>({id:'RPT-'+String(i+1).padStart(3,'0'),type:i<10?'Accommodation booking':'Online purchase',status:'Eligible'}));
function showToast(t){document.getElementById('toast').textContent=t;setTimeout(()=>document.getElementById('toast').textContent='',4000)}
function history(){return logs.length?logs.map(l=>`<div class="event">${esc(l.action)}<small>${l.time} · ${esc(l.reason)}</small></div>`).join(''):'<p class="muted">No new actions in this demo session.</p>'}
function show(title,body){modal.innerHTML=`<h2>${title}</h2>${body}<p>${btn('Close','close')}</p>`;modal.showModal()}
function decide(title,fn,extra=''){modal.innerHTML=`<h2>${title}</h2>${extra}<label>Reason<textarea id="reason" placeholder="Record what was reviewed and why..."></textarea></label><div class="row">${btn('Cancel','close')}<button class="primary" id="confirm" disabled>Confirm</button></div>`;modal.showModal();modal.querySelector('#reason').oninput=e=>modal.querySelector('#confirm').disabled=!e.target.value.trim();modal.querySelector('#confirm').onclick=()=>{const reason=modal.querySelector('#reason').value.trim();fn();logs.unshift({action:title,reason,time:new Date().toLocaleTimeString()});modal.close();render();showToast('Saved in this demo session.')};}
const views={
BO01:()=>`${heading('Overview','Monitor incoming reports, moderation work and agency responses.')}<div class="toolbar row"><select id="range" aria-label="Date range"><option>This month</option><option>No data for this range</option><option>Simulate loading error</option></select><select id="incident" aria-label="Incident type"><option>All incident types</option><option>Online purchase</option><option>Accommodation booking</option></select></div><section id="overview-data"><div class="cards">${[['New reports','24','reports'],['Community items','7','posts'],['Open disputes','3','disputes'],['Awaiting agency response','2','referrals']].map(([t,n,a])=>`<button class="card" data-action="${a}"><span>${t}</span><strong id="metric-${a}">${n}</strong>View work queue →</button>`).join('')}</div><div class="grid"><div class="panel"><h2>Reports by incident type</h2><div class="detail"><span>Online purchase</span><b>14 reports</b></div><div class="detail"><span>Accommodation booking</span><b>10 reports</b></div></div><div class="panel"><h2>Referral status</h2><div class="row between event"><span>Prepared</span><b>3</b></div><div class="row between event"><span>Sent, awaiting response</span><b>2</b></div><div class="row between event"><span>Acknowledged</span><b>1</b></div></div></div><div class="panel" style="margin-top:18px"><h2>Recent activity</h2><div class="row between event"><span>P-021 · Community review</span><button data-go="BO03">${post} →</button></div><div class="row between event"><span>DSP-004 · Linked-account correction</span><button data-go="BO04">${dispute} →</button></div><div class="row between event"><span>REF-002 · Agency acknowledgment</span><button data-go="BO05">${ref} →</button></div></div></section>${note('Figures are sample queue totals. Unavailable data is never replaced with zero.')}`,
BO02:()=>`${heading('Reports & Evidence','Review identifiers, source reports and case-scoped evidence.')}<div class="toolbar row"><input id="query" placeholder="Search report ID" aria-label="Report ID">${btn('Search reports','reports')}</div><div class="panel"><div class="row"><h2 style="margin:0">Report ${report}</h2>${badge('Accommodation','blue')}${badge(reports.find(x=>x.id===report)?.status||'Eligible','green')}</div>${note('Meets counting criteria · Facts not yet verified')}</div><div class="tabs">${['Details',...(caseAccess()?['Evidence']:[]),'Related identifiers'].map(x=>`<button data-tab="${x}" class="${tab===x?'active':''}">${x}</button>`).join('')}</div>${tab==='Evidence'&&caseAccess()?`<div class="panel"><h2>Private evidence · 2 files</h2><div class="row">${btn('View conversation.png','evidence')}${btn('View payment.pdf','evidence')}</div>${note('Authorized case staff only. Every evidence view is recorded in the audit log.')}</div>`:`<div class="grid"><div class="panel compact"><h2>Report detail</h2><p>Contact number: <b>0XX-XXX-XX12</b></p><p>Bank account: <b>Krungthai XXX-X-XX123-X</b></p><p>Bank account: <b>Kasikorn XXX-X-XX456-X</b></p><p>Related via: <b>RPT-001, RPT-008</b></p><p>Evidence: <b>2 files · case-scoped access only</b></p></div><div class="panel"><h2>Related identifiers</h2><div class="tag-row">${badge('Phone · matched')}${badge('Bank · KTB')}${badge(linked?'Bank · KBank':'KBank link removed','gray')}</div>${btn('Source: RPT-008','source')}<h2 style="margin-top:20px">History</h2><div class="row between event"><span>Report received</span><span>Submitted</span></div><div class="row between event"><span>Marked eligible</span><span>Auto-check passed</span></div></div></div>`}<div class="row toolbar">${btn('Request more info','more',true,!caseAccess())}${btn('Check for duplicates','duplicate',false,!caseAccess())}${btn('Create referral queue','queue',false,!caseAccess())}</div>${note('Evidence is hidden from unauthorized roles. Corrections require a reason and confirmation.')}`,
BO03:()=>`${heading('Community Moderation','Review the public version independently from private reports.')}<div class="panel" style="margin-top:24px"><div class="row">${badge(post,'orange')}<h2 style="margin:0">P-021 · Member A · Shared experience</h2></div><h3>Booked accommodation through a page, no booking confirmation received</h3><p>${esc(postText)}</p><div class="tag-row">${badge('No reported-party name shown','gray')}${badge('No account / URL shown','gray')}${badge('Linked to a private report','gray')}</div></div><div class="panel"><h2>Comment queue beneath this post</h2><div class="row between"><p>Member B: “Thanks for sharing, I will double-check before booking.”</p>${badge(comment,comment==='Published'?'green':'gray')}</div>${btn(comment==='Published'?'Hide comment':'Restore comment','comment',false,!moderate())}</div><div class="row">${btn('Restore publication','restore',true,!moderate())}${btn('Edit published version','edit',false,!moderate())}${btn('Keep hidden','hide',false,!moderate())}</div>${note('Restoring a post does not automatically restore comments hidden separately. No public evidence attachments.')}`,
BO04:()=>`${heading('Disputes','Review challenged data without exposing the original reporter.')}<div class="panel" style="margin-top:24px"><div class="row">${badge(dispute,'blue')}<h2 style="margin:0">Dispute DSP-004</h2></div>${note('References RPT-001')}</div><div class="grid"><div class="panel compact"><h2>Request detail</h2><p>Claim: <b>“This bank account has been linked to me in error.”</b></p><p>Requested action: <b>Review the source report</b></p><p>Supporting items: ${btn('1 attachment','attachment',false,!caseAccess())}</p><p>Reporter identity shown to disputant: <b>No</b></p><p>Relationship: <b>${linked?'Under review':'Incorrect KBank link removed'}</b></p></div><div class="panel"><h2>Timeline</h2><div class="row between event"><span>09:10</span>Request received</div><div class="row between event"><span>10:30</span>Assigned to officer</div><div class="row between event"><span>11:00</span>Requested more information</div><div class="event">${dispute}</div></div></div><div class="panel" style="margin-top:18px"><h2>Reason & decision</h2><p class="muted">Each action opens a confirmation form. A reason is required before saving.</p><div class="row">${btn('Request more info','dispute-more',true,!caseAccess())}${btn('Correct data','correct',false,!caseAccess())}${btn('Hide display','dispute-hide',false,!caseAccess())}</div></div>${note('Decisions and a simulated outcome notice are logged. No messages are sent outside this prototype.')}`,
BO05:()=>`${heading('Agency Referrals','Prepare the minimum data package and track delivery separately from case status.')}<div class="panel" style="margin-top:24px"><div class="row"><h2 style="margin:0">Referral REF-002</h2>${badge('AOC 1441 · Proposed cooperation','blue')}</div>${note('Channel and acknowledgment are simulated. No live integration.')}</div><div class="panel"><h2>Pre-send checklist</h2><label>Recipient<select id="recipient"><option>AOC 1441 · Proposed cooperation</option><option>Police receiving unit · Proposed cooperation</option></select></label><label class="check"><input type="checkbox" class="check-send"> Incident & transaction details included</label><label class="check"><input type="checkbox" class="check-send"> Victim contact channel included with authorized access</label><label class="check"><input type="checkbox" class="check-send"> Authorized evidence · 2 files included</label><label class="check"><input type="checkbox" class="check-send"> Posts, comments & unrelated personal data excluded</label></div><div class="status-line"><b>Status: ${ref}</b><div>No case outcome is implied by a delivery or acknowledgment status.</div></div><div class="row">${btn('View data package','package',false,!caseAccess())}${btn('Log response received','ack',true,!caseAccess()||!ref.startsWith('Sent'))}${btn('Send history','history')}<select id="result" aria-label="Simulated delivery result"><option>Successful delivery</option><option>Timeout</option><option>Delivery error</option></select><button id="send" data-action="send" disabled>Send simulated package</button></div>${note('Send is enabled only when all checks are complete. A timeout is recorded as unknown outcome, never received.')}`
};
function render(){if(!views[page])page='BO01';if(!caseAccess()&&tab==='Evidence')tab='Details';document.getElementById('nav').innerHTML=pages.map(([id,t])=>`<button data-go="${id}" class="${id===page?'active':''}">${t}</button>`).join('')+`<button data-action="history">Access & Audit</button>`;main.innerHTML=views[page]();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){page=b.dataset.go;render();return}if(b.dataset.report){report=b.dataset.report;page='BO02';modal.close();render();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}const a=b.dataset.action;if(!a)return;if(a==='close'){modal.close();return}if(a==='history'){show('Access & Audit',history());return}if(a==='reports'){let list=reports;const q=document.getElementById('query')?.value.trim().toUpperCase(),type=document.getElementById('incident')?.value;if(q)list=list.filter(r=>r.id.includes(q));if(type&&type!=='All incident types')list=list.filter(r=>r.type===type);show('Report queue',`<div class="table"><table>${list.map(r=>`<tr><td>${r.id}</td><td>${r.type}</td><td><button data-report="${r.id}">Open</button></td></tr>`).join('')||'<tr><td>No matching reports.</td></tr>'}</table></div>`);return}if(['posts','disputes','referrals'].includes(a)){const defs={posts:['BO03',7,'P-'],disputes:['BO04',3,'DSP-'],referrals:['BO05',2,'REF-']},[target,n,prefix]=defs[a];show('Work queue',Array.from({length:n},(_,i)=>`<div class="row between event"><span>${prefix}${String(i+(a==='posts'?21:a==='disputes'?4:2)).padStart(3,'0')} · Sample item</span><button data-go="${target}" onclick="document.getElementById('modal').close()">${i===0?'Open demo detail':'Open representative detail'}</button></div>`).join(''));return}if(a==='source'){report='RPT-008';render();return}
if(['restore','edit','hide','comment'].includes(a)){if(!moderate())return;if(a==='edit'){decide('Edit public version',()=>{postText=document.getElementById('public-copy').value;},`<label>Public text<textarea id="public-copy">${esc(postText)}</textarea></label>`)}else decide(a==='comment'?'Change comment visibility':a==='restore'?'Restore post':'Keep post hidden',()=>{if(a==='comment')comment=comment==='Published'?'Hidden':'Published';else post=a==='restore'?'Published':'Hidden'});return}
if(!caseAccess()){showToast('This role cannot perform this action.');return}
if(a==='evidence'||a==='attachment'){logs.unshift({action:'Viewed private sample attachment',reason:'Authorized case access',time:new Date().toLocaleTimeString()});show('Private attachment',`<div class="note">Sample evidence only. Masked transaction / supporting details. No real personal data.</div>`);return}
if(a==='package'){show('Referral package','<p>RPT-001 · Incident summary and masked transaction identifiers</p><p>Victim contact: authorized recipient only</p><p>Evidence: conversation.png, payment.pdf</p><p>Excluded: public posts, comments and unrelated personal data</p>');return}
if(a==='send'){if(![...document.querySelectorAll('.check-send')].every(x=>x.checked))return;const outcome=document.getElementById('result').value;decide('Send simulated referral',()=>ref=outcome==='Timeout'?'Unknown outcome':outcome==='Delivery error'?'Delivery failed':'Sent, awaiting acknowledgment');return}
const actions={more:['Request more information',()=>reports.find(r=>r.id===report).status='Awaiting information'],duplicate:['Mark duplicate of RPT-001',()=>reports.find(r=>r.id===report).status='Duplicate of RPT-001'],queue:['Create referral queue',()=>ref='Prepared'],'dispute-more':['Request supporting information',()=>dispute='Awaiting requester reply'],correct:['Remove incorrect KBank relationship and log outcome notice',()=>{linked=false;dispute='Resolved · simulated notice logged'}],'dispute-hide':['Hide challenged display and log outcome notice',()=>{reports[0].status='Hidden pending review';dispute='Display hidden · simulated notice logged'}],ack:['Record agency acknowledgment',()=>ref='Acknowledged']};if(a==='duplicate'&&report==='RPT-001'){show('Check for duplicates','<p>Open another source record before merging it into RPT-001.</p><button data-report="RPT-008">Open RPT-008</button>');return}if(actions[a])decide(...actions[a]);});
document.addEventListener('change',e=>{if(e.target.id==='role')render();if(e.target.classList.contains('check-send'))document.getElementById('send').disabled=!caseAccess()||![...document.querySelectorAll('.check-send')].every(x=>x.checked);if(e.target.id==='range'){if(e.target.value==='This month')render();else document.getElementById('overview-data').innerHTML=`<div class="panel"><h2>${e.target.value==='Simulate loading error'?'Unable to load data':'No data for this range'}</h2><p>Select another date range to retry.</p></div>`}if(e.target.id==='incident'){const el=document.getElementById('metric-reports');if(el)el.textContent=e.target.value==='All incident types'?24:e.target.value==='Online purchase'?14:10;}});render();
</script></html>
